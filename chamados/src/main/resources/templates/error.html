<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: lateral('')}"></aside>
    <main class="conteudo">
        <header class="topo">
            <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Algo deu errado'">Erro</h1>
        </header>
        <p class="mb-4" th:text="${status == 404} ? 'O endereço acessado não existe.' : 'Não foi possível concluir a operação. Tente novamente.'">Mensagem</p>
        <a class="btn btn-primary" th:href="@{/}">Voltar ao painel</a>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
