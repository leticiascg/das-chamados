<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${modo == 'novo' ? 'Novo técnico' : 'Editar técnico'})}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: lateral('tecnicos')}"></aside>
  <main class="conteudo">
    <header class="topo">
      <h1 th:text="${modo == 'novo'} ? 'Novo técnico' : 'Editar técnico'">Novo técnico</h1>
    </header>

    <form class="formulario" method="post" novalidate th:object="${form}"
          th:action="${modo == 'novo'} ? @{/ui/tecnicos} : @{/ui/tecnicos/{id}(id=${id})}">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" type="text" class="form-control" th:field="*{nome}" maxlength="100"
               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" autocomplete="name">
        <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="email" class="form-control" th:field="*{email}"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" autocomplete="email">
        <div class="invalid-feedback" th:errors="*{email}">Erro</div>
      </div>

      <div class="mb-4">
        <label for="perfil" class="form-label">Perfil</label>
        <select id="perfil" class="form-select" th:field="*{perfil}"
                th:classappend="${#fields.hasErrors('perfil')} ? 'is-invalid'">
          <option value="">Selecione</option>
          <option th:each="p : ${perfis}" th:value="${p}" th:text="${@rotulos.perfil(p)}">Perfil</option>
        </select>
        <div class="invalid-feedback" th:errors="*{perfil}">Erro</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"
                th:text="${modo == 'novo'} ? 'Cadastrar técnico' : 'Salvar alterações'">Salvar</button>
        <a class="btn btn-light" th:href="@{/ui/tecnicos}">Cancelar</a>
      </div>
    </form>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
