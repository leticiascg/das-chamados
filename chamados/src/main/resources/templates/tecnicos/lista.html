<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Técnicos')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: lateral('tecnicos')}"></aside>
  <main class="conteudo">
    <header class="topo">
      <h1>Técnicos</h1>
      <a class="btn btn-primary" th:href="@{/ui/tecnicos/novo}">Cadastrar técnico</a>
    </header>

    <div th:replace="~{fragments/layout :: aviso}"></div>

    <p class="vazio" th:if="${#lists.isEmpty(tecnicos)}">
      Nenhum técnico cadastrado. Cadastre um técnico para poder atribuir chamados.
    </p>

    <div class="tabela-caixa" th:unless="${#lists.isEmpty(tecnicos)}">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <caption class="visually-hidden">Lista de técnicos</caption>
          <thead>
            <tr><th scope="col">Nome</th><th scope="col">E-mail</th><th scope="col">Perfil</th>
                <th scope="col" class="text-end"><span class="visually-hidden">Ações</span></th></tr>
          </thead>
          <tbody>
            <tr th:each="t : ${tecnicos}">
              <td class="fw-semibold" th:text="${t.nome}">Nome</td>
              <td th:text="${t.email}">email</td>
              <td><span class="etiqueta pr-media" th:text="${@rotulos.perfil(t.perfil)}">Perfil</span></td>
              <td class="text-end acoes">
                <a class="btn btn-sm btn-light" th:href="@{/ui/tecnicos/{id}/editar(id=${t.id})}">Editar</a>
                <form class="d-inline" th:action="@{/ui/tecnicos/{id}/excluir(id=${t.id})}" method="post"
                      onsubmit="return confirm('Excluir este técnico?');">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
