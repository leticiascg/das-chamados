<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' - Chamados'">Chamados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
  <aside class="lateral" th:fragment="lateral(ativo)">
    <a class="marca" th:href="@{/}">Chamados</a>
    <nav class="menu" aria-label="Principal">
      <a th:href="@{/}" th:classappend="${ativo == 'painel'} ? 'ativo'"
         th:attr="aria-current=${ativo == 'painel'} ? 'page'">Painel</a>
      <a th:href="@{/ui/chamados}" th:classappend="${ativo == 'chamados'} ? 'ativo'"
         th:attr="aria-current=${ativo == 'chamados'} ? 'page'">Chamados</a>
      <a th:href="@{/ui/clientes}" th:classappend="${ativo == 'clientes'} ? 'ativo'"
         th:attr="aria-current=${ativo == 'clientes'} ? 'page'">Clientes</a>
      <a th:href="@{/ui/tecnicos}" th:classappend="${ativo == 'tecnicos'} ? 'ativo'"
         th:attr="aria-current=${ativo == 'tecnicos'} ? 'page'">Técnicos</a>
      <a th:href="@{/ui/categorias}" th:classappend="${ativo == 'categorias'} ? 'ativo'"
         th:attr="aria-current=${ativo == 'categorias'} ? 'page'">Categorias</a>
    </nav>
  </aside>

  <div th:fragment="aviso">
    <div class="alert alert-success alert-dismissible fade show" role="status" th:if="${sucesso}">
      <span th:text="${sucesso}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${erro}">
      <span th:text="${erro}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
  </div>

  <th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </th:block>
</body>
</html>
