<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: lateral('')}"></aside>
  <main class="conteudo">
    <header class="topo"><h1 th:text="${titulo}">Erro</h1></header>
    <p class="mb-4" th:text="${mensagem}">Mensagem</p>
    <a class="btn btn-primary" th:href="@{/}">Voltar ao painel</a>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
