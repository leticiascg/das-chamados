<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${modo == 'novo' ? 'Novo cliente' : 'Editar cliente'})}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: lateral('clientes')}"></aside>
  <main class="conteudo">
    <header class="topo">
      <h1 th:text="${modo == 'novo'} ? 'Novo cliente' : 'Editar cliente'">Novo cliente</h1>
    </header>

    <form class="formulario" method="post" novalidate th:object="${form}"
          th:action="${modo == 'novo'} ? @{/ui/clientes} : @{/ui/clientes/{id}(id=${id})}">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" type="text" class="form-control" th:field="*{nome}" maxlength="100"
               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" autocomplete="name">
        <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="email" class="form-control" th:field="*{email}"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" autocomplete="email">
        <div class="invalid-feedback" th:errors="*{email}">Erro</div>
      </div>

      <div class="mb-4">
        <label for="telefone" class="form-label">Telefone <span class="text-secondary">(opcional)</span></label>
        <input id="telefone" type="tel" class="form-control" th:field="*{telefone}" maxlength="20"
               placeholder="47999999999" th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'" autocomplete="tel">
        <div class="invalid-feedback" th:errors="*{telefone}">Erro</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"
                th:text="${modo == 'novo'} ? 'Cadastrar cliente' : 'Salvar alterações'">Salvar</button>
        <a class="btn btn-light" th:href="${modo == 'novo'} ? @{/ui/clientes} : @{/ui/clientes/{id}(id=${id})}">Cancelar</a>
      </div>
    </form>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
