<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: lateral('categorias')}"></aside>
  <main class="conteudo">
    <header class="topo">
      <h1>Categorias</h1>
      <a class="btn btn-primary" th:href="@{/ui/categorias/novo}">Cadastrar categoria</a>
    </header>

    <div th:replace="~{fragments/layout :: aviso}"></div>

    <p class="vazio" th:if="${#lists.isEmpty(categorias)}">
      Nenhuma categoria cadastrada. Cadastre ao menos uma (por exemplo, Rede ou Software) para poder abrir chamados.
    </p>

    <div class="tabela-caixa" th:unless="${#lists.isEmpty(categorias)}">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <caption class="visually-hidden">Lista de categorias</caption>
          <thead>
            <tr><th scope="col">Nome</th><th scope="col">Descrição</th>
                <th scope="col" class="text-end"><span class="visually-hidden">Ações</span></th></tr>
          </thead>
          <tbody>
            <tr th:each="c : ${categorias}">
              <td class="fw-semibold" th:text="${c.nome}">Nome</td>
              <td th:text="${c.descricao}">Descrição</td>
              <td class="text-end acoes">
                <a class="btn btn-sm btn-light" th:href="@{/ui/categorias/{id}/editar(id=${c.id})}">Editar</a>
                <form class="d-inline" th:action="@{/ui/categorias/{id}/excluir(id=${c.id})}" method="post"
                      onsubmit="return confirm('Excluir esta categoria?');">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
