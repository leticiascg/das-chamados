<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${modo == 'novo' ? 'Nova categoria' : 'Editar categoria'})}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: lateral('categorias')}"></aside>
  <main class="conteudo">
    <header class="topo">
      <h1 th:text="${modo == 'novo'} ? 'Nova categoria' : 'Editar categoria'">Nova categoria</h1>
    </header>

    <form class="formulario" method="post" novalidate th:object="${form}"
          th:action="${modo == 'novo'} ? @{/ui/categorias} : @{/ui/categorias/{id}(id=${id})}">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" type="text" class="form-control" th:field="*{nome}" maxlength="100"
               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
      </div>

      <div class="mb-4">
        <label for="descricao" class="form-label">Descrição <span class="text-secondary">(opcional)</span></label>
        <textarea id="descricao" rows="3" class="form-control" th:field="*{descricao}" maxlength="255"
                  th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:errors="*{descricao}">Erro</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"
                th:text="${modo == 'novo'} ? 'Cadastrar categoria' : 'Salvar alterações'">Salvar</button>
        <a class="btn btn-light" th:href="@{/ui/categorias}">Cancelar</a>
      </div>
    </form>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
